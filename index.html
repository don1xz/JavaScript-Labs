<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Умный Список(наверное)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="todo-wrapper">
  <header>
    <h1>Мой To-Do List</h1>
  </header>

  <section class="input-section">
    <form id="todo-form">
      <div class="input-group">
        <input type="text" id="task-input" placeholder="Что нужно сделать?...">
        <button type="submit" id="add-btn">Добавить</button>
      </div>
      <span class="error-message" id="error-text"></span>
    </form>
  </section>

  <section class="controls-section">
    <input type="text" id="search-input" placeholder="Поиск по задачам...">

    <div class="filter-buttons">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="active">Активные</button>
      <button class="filter-btn" data-filter="completed">Выполненные</button>
    </div>
  </section>

  <main class="list-section">
    <ul id="task-list">
      <!-- Сюда JavaScript будет динамически добавлять элементы (li) -->
    </ul>
  </main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
